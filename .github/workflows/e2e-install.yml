name: E2E Binary Install

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - Asli
      - main
      - dev
    tags:
      - "is.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binary-install:
    name: Install on a fresh runner and check port 616
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Run binary install end-to-end test
        env:
          GAMAJ_E2E_PREFIX: /tmp/gamaj-e2e
        run: sudo env "PATH=$PATH" bash scripts/tests/e2e-binary-install.sh
