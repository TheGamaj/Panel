name: Brand Guard

# The Gamaj identity is monochrome apart from three status hues, and every
# surface has to reach its colours through the palette rather than by writing
# a hex out by hand. Nothing enforced that before it was checked, so a colour
# written directly into a component or a translation string would have merged
# unnoticed. This job makes that a build failure instead.
#
# The guard is a vendored copy of Web/tools/check-brand-geometry.cjs. It runs
# here rather than in the docs repository because this repository has a remote
# and the docs repository does not, and because CI cannot check a repository it
# cannot see. GAMAJ_PALETTE_DIRS and GAMAJ_LOGO_DIRS limit it to the surfaces
# this repository owns.
#
# The logo rule matters here because a colour guard cannot see a mark. A panel
# once shipped an invented mascot drawn in exactly the right palette; nothing
# about it was off-colour, so the palette check passed and the wrong logo went
# out. The geometry check compares every mark against the canonical symbol.

on:
  push:
    branches:
      - Asli
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brand-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GAMAJ_BRAND_ROOT: .
      GAMAJ_PALETTE_DIRS: dashboard/src,dashboard/public,templates/subscription/index.html
      GAMAJ_LOGO_DIRS: dashboard/src,templates/subscription

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Check palette, retired branding and logo geometry
        run: node tools/check-brand-geometry.cjs