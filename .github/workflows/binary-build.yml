name: Binary Build

on:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Build every Linux architecture. This is slower than the default release build."
        required: false
        type: boolean
        default: false
  push:
    branches:
      - Asli
    tags:
      - "is.*"
  pull_request:
    branches:
      - "**"
  release:
    types:
      - published
      - prereleased

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DASH_DIR: ./dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ env.DASH_DIR }}/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.7'
          extended: true

      - name: Install dashboard dependencies
        working-directory: ${{ env.DASH_DIR }}
        run: npm ci

      - name: Test dashboard
        working-directory: ${{ env.DASH_DIR }}
        run: npm test

      - name: Lint dashboard
        working-directory: ${{ env.DASH_DIR }}
        run: npm run lint

      - name: Build dashboard
        run: bash scripts/build_dashboard.sh

      - name: Test Go
        run: go test ./internal/app/admin ./internal/app/backup ./internal/app/migrations

      # The Go compiler accepts a method nobody calls, so a handler can be
      # written, reviewed and unit-tested in isolation and still be absent from
      # the router - which is how the whole bot sales API once answered 404
      # while every other job stayed green. This reads the package and fails on
      # any handler no non-test code references.
      - name: Guard against unrouted handlers
        run: go test ./internal/platform/routeguard/ -v

      # internal/app/api cannot run wholesale: it carries pre-existing failures
      # in stale hand-built schema fixtures (missing columns such as
      # reseller_settings and usage_coefficient), a test that writes to
      # /var/lib/gamaj, and a nil-database panic in the outbound traffic test.
      # That is why the package was never part of this workflow at all. The
      # tests below are self-contained - each builds its own SQLite database
      # from the real migrations in a temp dir - and they are the ones that
      # matter here: the bot sales API once shipped completely unrouted while
      # every suite in this workflow stayed green.
      - name: Test bot sales API
        run: go test ./internal/app/api/ -run 'TestBotRoutesAreRegistered|TestSales' -v

      - name: Environment naming guard
        run: go test ./internal/platform/envguard/

      - name: Test binary database lifecycle
        run: bash scripts/gamaj/test-database-maintenance.sh

      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: dashboard/build

  build-linux:
    needs: dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_arch: "386"
            goarch: "386"
            goarm: ""
          - asset_arch: amd64
            goarch: amd64
            goarm: ""
          - asset_arch: arm64
            goarch: arm64
            goarm: ""
          - asset_arch: armv5
            goarch: arm
            goarm: "5"
          - asset_arch: armv6
            goarch: arm
            goarm: "6"
          - asset_arch: armv7
            goarch: arm
            goarm: "7"
          - asset_arch: s390x
            goarch: s390x
            goarm: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate installer shell scripts
        shell: bash
        run: bash -n scripts/gamaj/gamaj.sh scripts/gamaj/gamaj-node.sh

      - name: Download dashboard
        uses: actions/download-artifact@v4
        with:
          name: dashboard-build
          path: dashboard/build

      - name: Set up Go
        if: matrix.asset_arch == 'amd64' || github.ref_type == 'tag' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix == true)
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Build Linux binary package
        if: matrix.asset_arch == 'amd64' || github.ref_type == 'tag' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix == true)
        shell: bash
        env:
          ASSET_NAME: gamaj-linux-${{ matrix.asset_arch }}.tar.gz
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          set -euo pipefail
          bash scripts/build_binary.sh
          tar -C dist -czf "dist/${ASSET_NAME}" gamaj-server gamaj-cli templates
          sha256sum "dist/${ASSET_NAME}"

      - name: Upload Linux package artifact
        if: matrix.asset_arch == 'amd64' || github.ref_type == 'tag' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix == true)
        uses: actions/upload-artifact@v4
        with:
          name: gamaj-linux-${{ matrix.asset_arch }}
          path: dist/gamaj-linux-${{ matrix.asset_arch }}.tar.gz

  build-windows-amd64:
    needs: dashboard
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download dashboard
        uses: actions/download-artifact@v4
        with:
          name: dashboard-build
          path: dashboard/build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Set up Windows C toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add Windows C toolchain to PATH
        shell: msys2 {0}
        run: |
          set -euo pipefail
          toolchain_path="$(cygpath -w "${MINGW_PREFIX}/bin")"
          echo "${toolchain_path}" >> "${GITHUB_PATH}"
          gcc --version

      - name: Build Windows binaries
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_binary.sh

      - name: Package Windows binaries
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/gamaj-server.exe, dist/gamaj-cli.exe, dist/templates `
            -DestinationPath dist/gamaj-windows-amd64.zip `
            -Force

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamaj-windows-amd64
          path: dist/gamaj-windows-amd64.zip

  publish-release:
    needs:
      - build-linux
      - build-windows-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'release' || github.ref_type == 'tag'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            RELEASE_TAG="${{ github.event.release.tag_name }}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gamaj-*
          path: release-assets
          merge-multiple: true

      - name: Upload release assets
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ steps.meta.outputs.release_tag }}"
          notes_file=".github/release-notes/${release_tag}.md"

          if [ -f "${notes_file}" ]; then
            cp "${notes_file}" release-body.md
          else
            printf 'Gamaj %s\n' "${release_tag}" > release-body.md
          fi

          gh release view "${release_tag}" >/dev/null 2>&1 || \
            gh release create "${release_tag}" --title "${release_tag}" --notes-file release-body.md

          gh release upload "${release_tag}" release-assets/gamaj-* --clobber

