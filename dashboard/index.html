<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gamaj</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/statics/favicon/apple-touch-icon.png"
    />
    <!-- The SVG favicon is theme-aware: gamaj-mark.svg carries its own
         prefers-color-scheme block, because an SVG favicon is rendered outside
         the document and cannot resolve currentColor. The raster fallbacks
         below are a black tile with a white mark. -->
    <link rel="icon" type="image/svg+xml" href="/statics/favicon/gamaj-mark.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/statics/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/statics/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="/statics/favicon/site.webmanifest" />
    <link
      rel="mask-icon"
      href="/statics/favicon/safari-pinned-tab.svg"
      color="#000000"
    />
    <link rel="shortcut icon" href="/statics/favicon/favicon.ico" />
    <meta name="apple-mobile-web-app-title" content="Gamaj" />
    <meta name="application-name" content="Gamaj" />
    <meta name="msapplication-TileColor" content="#0A0A0A" />
    <meta name="msapplication-config" content="/statics/favicon/browserconfig.xml" />
    <meta name="theme-color" content="#0A0A0A" />
    <script>
      (function () {
        try {
          var stored =
            localStorage.getItem("gm-theme") ||
            localStorage.getItem("chakra-ui-color-mode") ||
            "dark";
          var mode = stored === "light" ? "light" : "dark";
          localStorage.setItem("gm-theme", mode);
          localStorage.setItem("chakra-ui-color-mode", mode);
          var root = document.documentElement;
          root.classList.remove(
            "gm-theme-light",
            "gm-theme-dark",
            "chakra-ui-light",
            "chakra-ui-dark"
          );
          root.classList.add("gm-theme-" + mode, "chakra-ui-" + mode);
          root.dataset.theme = mode;
          root.style.colorScheme = mode;
          // The brand is monochrome: the browser chrome matches the surface,
          // so it is pure black in dark mode and pure white in light mode.
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            themeColor.setAttribute("content", mode === "light" ? "#FFFFFF" : "#000000");
          }
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root" class="notranslate" translate="no"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
